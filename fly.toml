app = "quicksave-banking"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8000"
  SEED_DEMO_DATA = "true"
  AI_ENABLED = "true"
  DATABASE_URL = "sqlite:////app/data/quicksave.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Optional persistent volume for SQLite — create with:
# fly volumes create quicksave_data --region iad --size 1
# Then uncomment:
# [[mounts]]
#   source = "quicksave_data"
#   destination = "/app/data"
